<style>
:root{
 --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#30363d;
 --ink:#e6edf3; --mut:#8b949e; --acc:#58a6ff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
#app{display:flex;height:100vh}
#graph{flex:1;position:relative}
svg{width:100%;height:100%;display:block;cursor:grab}
svg:active{cursor:grabbing}
.link{stroke:#3d4653;stroke-opacity:.55}
.link.hi{stroke:var(--acc);stroke-opacity:.95}
.link.agg{stroke:#db61a2;stroke-dasharray:4 3;stroke-opacity:.8}
.node circle{stroke:#0d1117;stroke-width:1.5px;cursor:pointer}
.node.concept circle{stroke:#3fb950;stroke-width:2px}
.node.measure circle{stroke:#db61a2;stroke-width:2px}
.node.dim{opacity:.12}
.link.dim{opacity:.04}
.node text{font-size:9px;fill:var(--mut);pointer-events:none;paint-order:stroke;stroke:#0d1117;stroke-width:3px}
.elabel{font-size:6.5px;fill:#7d8794;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#0d1117;stroke-width:2.5px;letter-spacing:.02em}
.elabel.hi{fill:#9fd0ff;font-size:9px;font-weight:600}
.elabel.dim{opacity:.05}
.node.big text{fill:var(--ink);font-size:11px;font-weight:600}
#side{width:360px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#side header{padding:14px 18px 12px;border-bottom:1px solid var(--line)}
#side h1{font-size:15px;margin:0 0 3px}
#side .sub{font-size:11px;color:var(--mut)}
#banner{font-size:11px;line-height:1.45;padding:9px 12px;margin:10px 14px 0;border-radius:8px}
#banner.demo{background:#3d2c07;border:1px solid #7a5c14;color:#f0d488}
#banner.faithful{background:#0b2d1a;border:1px solid #1f6b3f;color:#7ee7a8}
#tabs{display:flex;gap:4px;padding:10px 14px 0}
.tab{font-size:11px;padding:6px 10px;border-radius:6px 6px 0 0;color:var(--mut);cursor:pointer;border:1px solid transparent}
.tab.on{background:var(--panel2);color:var(--ink);border-color:var(--line);border-bottom-color:var(--panel2)}
#body{flex:1;overflow-y:auto;padding:14px 16px;font-size:12.5px;line-height:1.5}
.empty{color:var(--mut);font-size:12px;margin-top:20px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #21262d}
.kv .k{color:var(--mut)}.kv .v{text-align:right;word-break:break-word}
.badge{display:inline-block;font-size:10px;font-weight:600;padding:2px 8px;border-radius:20px;color:#0d1117;margin-bottom:8px}
.sect{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:14px 0 4px}
.sect.l2{color:#f0a35e}
.l2box{background:#241a10;border:1px dashed #7a5418;border-radius:8px;padding:8px 10px;margin-top:6px}
.l2tag{font-size:9px;color:#f0a35e;border:1px solid #7a5418;border-radius:10px;padding:0 6px;margin-left:6px}
.prov{font-size:11px;color:var(--mut);font-style:italic;margin-top:8px;line-height:1.4}
.rel{padding:5px 0;border-bottom:1px solid #21262d;font-size:11.5px}
.rel .t{color:var(--acc);cursor:pointer}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#ctrl{position:absolute;top:12px;left:12px;background:rgba(22,27,34,.92);border:1px solid var(--line);border-radius:10px;padding:10px 12px;max-width:255px;backdrop-filter:blur(4px)}
#ctrl input{width:100%;background:#0d1117;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:6px 8px;font-size:12px;margin-bottom:8px}
.leg{display:flex;align-items:center;gap:7px;font-size:11px;padding:2px 0;cursor:pointer;user-select:none}
.leg.off{opacity:.35}
.dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.leg .n{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
#hint{position:absolute;bottom:12px;left:12px;font-size:10.5px;color:var(--mut);background:rgba(22,27,34,.85);padding:6px 10px;border-radius:8px}
.note{font-size:11.5px;color:var(--mut);line-height:1.55}
.note b{color:var(--ink)}
.strike{color:#f43f5e;font-weight:600}
#reset{position:absolute;top:12px;right:12px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:11px;padding:6px 11px;border-radius:7px;cursor:pointer}
</style></head>

 if(d.element_class==="concept"){
   h+=`<div class="sect">Definition</div>${esc(d.definition||"")}`;
   if(d.members!=null)h+=`<div class="kv"><span class="k">materialised instances</span><span class="v">${d.members}</span></div>`;
   h+=`<div class="prov">One node per TYPE regardless of row count (Q39).</div>`;
 } else if(d.element_class==="measure_element"){
   h+=`<div class="sect">Definition</div>${esc(d.definition||"")}`;
   h+=kvBlock({summable:d.summable,basis_dimension:d.basis_dimension||"—",source:d.source,measures:d.measures_concept});
   h+=`<div class="l2box"><b style="color:#f0a35e">No values stored here.</b> A measure element carries a definition only; its numbers federate via Layer 2 at query time (Q43/Q68).</div>`;
 } else {
   // thin instance / event / document / alias
   if(FAITHFUL){
     h+=`<div class="sect">Layer 1 element — 4 fields only (Q39)</div>`;
     h+=kvBlock({entity_type:d.entity_type,
                 source_key:d.source_key?`${d.source_key.field} = ${d.source_key.value}`:"—",
                 label:d.label});
     if(d.event_shape)h+=`<div class="prov" style="font-style:normal">${esc(d.event_shape)}</div>`;
     const dd=DD.nodes[d.id];
     if(dd){h+=`<div class="sect l2">Demo display values <span class="l2tag">Layer 2 · not in Layer 1</span></div>`;
       h+=`<div class="l2box">`;
       if(dd.attributes)h+=`<div style="font-size:10px;color:#f0a35e;margin-bottom:2px">attributes</div>`+kvBlock(dd.attributes);
       if(dd.measures)h+=`<div style="font-size:10px;color:#f0a35e;margin:6px 0 2px">measures</div>`+kvBlock(dd.measures);
       h+=`<div class="prov" style="margin-top:6px">Federated from source at query time (Q43). Shown for the demo; deliberately outside the graph elements.</div></div>`;}
   } else {
     if(d.anchor)h+=`<div class="sect">Anchor</div><div class="kv"><span class="k">${esc(d.anchor.field)}</span><span class="v mono">${esc(d.anchor.value)}</span></div>`;
     if(d.attributes&&Object.keys(d.attributes).length){h+=`<div class="sect">Attributes <span class="l2tag">↔ Layer 2 in prod</span></div>`+kvBlock(d.attributes);}
     if(d.measures&&Object.keys(d.measures).length){h+=`<div class="sect">Measures <span class="l2tag">↔ Layer 2 in prod</span></div>`+kvBlock(d.measures);}
   }
 }
 // relationships
 const rels=adj.get(d.id);
 if(rels.length){h+=`<div class="sect">Relationships (${rels.length})</div>`;
   rels.slice(0,45).forEach(l=>{const out=(l.source.id||l.source)===d.id;const oid=out?(l.target.id||l.target):(l.source.id||l.source);const other=byId.get(oid);
     const arrow=out?'→':'←';h+=`<div class="rel">${arrow} <b>${esc(l.type)}</b> <span class="t" data-id="${oid}">${esc(other?other.label:'?')}</span>`;
     const props=l.properties||(DD.edges[l.id]&&DD.edges[l.id].properties);
     if(props){const bits=[];if(props.manifests)bits.push(props.manifests+' manifests');if(props.total_tons)bits.push(props.total_tons+' t');if(props.penalty_usd)bits.push('$'+props.penalty_usd);if(props.waste_codes_seen)bits.push(props.waste_codes_seen);
       if(bits.length)h+=`<div style="color:var(--mut);font-size:10.5px;margin-top:2px">${esc(bits.join(' · '))}${FAITHFUL?' <span class="l2tag">Layer 2</span>':''}</div>`;}
     h+=`</div>`;});}
 if(d.provenance)h+=`<div class="prov">▸ ${esc(d.provenance)}</div>`;
 const box=document.getElementById("detail");box.innerHTML=h;
 box.querySelectorAll(".t").forEach(el=>el.onclick=()=>{const n=byId.get(el.dataset.id);if(n){select(n);centerOn(n);}});}
function centerOn(n){const t=d3.zoomTransform(svg.node());const k=Math.max(t.k,1.1);
 svg.transition().duration(500).call(zoom.transform,d3.zoomIdentity.translate(W()/2,H()/2).scale(k).translate(-n.x,-n.y));}
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function fmt(v){return typeof v==='number'?v.toLocaleString():esc(v);}

// legend
const present=[...new Set(nodes.map(n=>n.type))];
const order=["Concept","Facility","Document","Manifest","Evaluation","Violation","Enforcement","Alias","Measure"];
const types=order.filter(t=>present.includes(t));
const active=new Set(types);
const counts={};nodes.forEach(n=>counts[n.type]=(counts[n.type]||0)+1);
const leg=document.getElementById("legend");
types.forEach(t=>{const row=document.createElement("div");row.className="leg";row.dataset.t=t;
 row.innerHTML=`<span class="dot" style="background:${RAW[t]}"></span>${t}<span class="n">${counts[t]||0}</span>`;
 row.onclick=()=>{if(active.has(t))active.delete(t);else active.add(t);row.classList.toggle("off");applyFilter();};leg.appendChild(row);});
function edgeVisible(l){return active.has((byId.get(l.source.id||l.source)||{}).type)&&active.has((byId.get(l.target.id||l.target)||{}).type);}
function applyFilter(){node.style("display",n=>active.has(n.type)?null:"none");
 link.style("display",l=>edgeVisible(l)?null:"none");
 elabel.style("display",l=>edgeVisible(l)?null:"none");}
document.getElementById("search").addEventListener("input",e=>{const q=e.target.value.toLowerCase().trim();
 if(!q){if(!cur)node.classed("dim",false);return;}
 node.classed("dim",n=>!(n.label.toLowerCase().includes(q)||n.id.toLowerCase().includes(q)));link.classed("dim",true);});

document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>showTab(t.dataset.t));
function showTab(name){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x.dataset.t===name));
 document.getElementById("detail").style.display=name==="detail"?"":"none";
 document.getElementById("detailEmpty").style.display=(name==="detail"&&!cur)?"":"none";
 document.getElementById("model").style.display=name==="model"?"":"none";}

// banner
const ban=document.getElementById("banner");
if(FAITHFUL){ban.className="faithful";ban.innerHTML="<b>Spec-faithful.</b> Thin instances carry only identity + provenance (Q39). Attribute/measure <b>values</b> are NOT in Layer 1 — they live in a separate demo-display cache representing what Layer 2 federates at query time (Q43). Concepts and measure elements are their own element classes.";}
else{ban.className="demo";ban.innerHTML="<b>Demo-friendly (honest).</b> Structure is spec-accurate (rows→nodes, columns folded, events on demand). Values are <b>inlined on nodes for legibility</b> — in the real AGB build these federate via Layer 2 (Q43), not stored in Layer 1. Placement is a demo concession, flagged as such.";}

// model tab
const bm=DATA.build_model||{};let mh=`<div class="note"><b>${esc((DATA.dataset&&DATA.dataset.name)||'VLS EPA hazwaste catalog')}</b>`;
if(bm.principle)mh+=`<div class="sect">Principle</div>${esc(bm.principle)}`;
if(bm.element_classes){mh+=`<div class="sect">Element classes</div>`;const ec=bm.element_classes;
 if(Array.isArray(ec))ec.forEach(s=>mh+=`• ${esc(s)}<br>`);else for(const[k,v]of Object.entries(ec))mh+=`• <b>${esc(k)}</b> — ${esc(v)}<br>`;}
if(bm.faithful_notes){mh+=`<div class="sect">Modelling notes</div>`;bm.faithful_notes.forEach(s=>mh+=`• ${esc(s)}<br>`);}
if(DATA.honesty){mh+=`<div class="sect l2">Honesty note</div><div class="l2box">${esc(DATA.honesty)}</div>`;}
if(DATA.layer2){mh+=`<div class="sect l2">Layer 2 federation</div>${esc(DATA.layer2.description)}<div class="l2box" style="margin-top:6px">`;
 DATA.layer2.mappings.forEach(m=>mh+=`<div class="kv"><span class="k" style="max-width:60%">${esc(m.element)}</span><span class="v">${esc(m.resolves_to)}</span></div>`);mh+=`</div>`;}
const nn=DATA.not_nodes||{};if(Object.keys(nn).length){mh+=`<div class="sect">Columns that are NOT nodes</div>`;
 for(const[k,v]of Object.entries(nn))mh+=`<span class="strike">✗ ${esc(k)}</span> — ${esc(typeof v==='string'?v:JSON.stringify(v))}<br>`;}
mh+=`</div>`;document.getElementById("model").innerHTML=mh;
document.getElementById("subtitle").textContent=`${nodes.length} nodes · ${links.length} edges · ${MODE.replace(/_/g,' ')}`;
</script></body></html>
