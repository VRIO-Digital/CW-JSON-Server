function bump(what, by = 'nishant', s = sub()) { s.version++; s.history.push({ v: s.version, at: nowISO(), by, what }); }

function downloadMain() { const s = sub(); const f = downloadFiles(s)[0]; eval(f[3]); }
/* The files a download contains: exactly the template's `files`, each mapped to how the prototype produces it. */

  if (m.kind === 'addob') { const k = m.target === 'setup' ? setupKind() : curStream().kind; const recs = m.target === 'setup' ? recipientsOn().map(r => r.short) : [...new Set(DB.obligations.filter(o => o.stream === curStream().id).map(o => o.toShort))]; const opts = [...ownTemplates(), ...standardTemplates().filter(t => t.kinds.includes(k) || t.kinds.includes('Other'))];
    inner = `<h2>Add an obligation</h2><div class="mut sm" style="margin:6px 0 12px">A deliverable the agents did not find. It is added as <b>declared by you</b>, made from a template in the library${m.target === 'setup' ? ' — pick it here or in the next step' : ''}.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="f">Obligation name<input type="text" id="ao_label" placeholder="${k === 'Regulatory' ? 'e.g. Lead service line mechanism — annual report' : k === 'Internal' ? 'e.g. Audit committee capital controls memo' : 'e.g. Quarterly capital report'}"></label><label class="f">Recipient<select id="ao_to" style="font:inherit;padding:7px 10px;border:1px solid var(--line2);border-radius:8px">${[...recs, 'Other'].map(x => `<option>${esc(x)}</option>`).join('')}</select></label>
      <label class="f">Made from<select id="ao_deliv" style="font:inherit;padding:7px 10px;border:1px solid var(--line2);border-radius:8px">${m.target === 'setup' ? '<option value="">— pick in the Templates step —</option>' : ''}${opts.map(t => `<option value="${t.id}">${esc(t.name)} — ${DB.formats[t.format].label} (${ORIGIN[t.origin][0].toLowerCase()})</option>`).join('')}</select></label><label class="f">Cadence<select id="ao_cad" style="font:inherit;padding:7px 10px;border:1px solid var(--line2);border-radius:8px"><option>Annual</option><option>Semi-annual</option><option>Quarterly</option><option>Monthly</option><option>Per case</option><option>One-off</option></select></label>
      <label class="f">Period (optional)<input type="text" id="ao_period" placeholder="e.g. Calendar year 2026"></label><label class="f">Due date (optional — empty keeps it as "No dates configured")<input type="date" id="ao_due"></label><label class="f">Drafting lead (days)<input type="text" id="ao_lead" value="30"></label></div>
      <div class="acts"><button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn pri" onclick="addObligation('${m.target}')">Add obligation</button></div>`; }
  if (m.kind === 'picker') { const k = setupKind(); const list = [...ownTemplates(), ...standardTemplates().filter(t => t.kinds.includes(k) || t.kinds.includes('Other'))]; const cur = tailorOf(m.key).tpl;
    inner = `<h2>Change the template</h2><div class="mut sm" style="margin:6px 0 12px">From the library — yours first, then the standard templates for this kind. Open one to look at it; pick one and the sections, checks and download follow it.</div><div class="files">${list.map(t => `<div class="f" style="${t.id === cur ? 'border-color:var(--orange)' : ''}"><span class="ic">${DB.formats[t.format].ico}</span><div class="grow"><b class="sm">${esc(t.name)}</b> ${originChip(t)}<div class="mut xs">${DB.formats[t.format].label} · ${t.sections.length} sections · ${t.checks.length} checks · ${esc(t.purpose)}</div></div><button class="btn sm ghost" onclick="openTemplate('${t.id}')">Open ↗</button>${t.id === cur ? '<span class="dim xs">current</span>' : `<button class="btn sm" onclick="swapTemplate('${m.key}','${t.id}')">Use</button>`}</div>`).join('')}</div><div class="acts"><button class="btn" onclick="S.modal=null;render()">Close</button></div>`; }
  if (m.kind === 'compose') inner = `<h2>Compose a template from parts</h2><div class="mut sm" style="margin:6px 0 12px">Added to the library${m.key ? ' and selected for this obligation' : ''}. Pick a format and the parts. Each part carries its own rules — a schedule needs a source on every cell, a narrative cites every figure — so this is not a blank page. Figures are mapped to graph sources when the first draft is generated.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px"><label class="f">Template name<input type="text" id="ct_name" placeholder="e.g. Audit committee capital controls memo"></label><label class="f">Format<select id="ct_fmt" style="font:inherit;padding:7px 10px;border:1px solid var(--line2);border-radius:8px">${Object.entries(DB.formats).map(([id, f]) => `<option value="${id}">${f.label}</option>`).join('')}</select></label></div>
      <h4 style="margin-bottom:6px">Parts</h4>${DB.parts.map(p => `<div class="row" style="gap:10px;padding:6px 0;border-bottom:1px solid var(--line)"><input type="checkbox" id="ct_${p[0]}" ${['schedule', 'narrative'].includes(p[0]) ? 'checked' : ''}><div><b class="sm">${p[1]}</b><div class="dim xs">${p[2]}</div></div></div>`).join('')}
      <div class="acts"><button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn pri" onclick="composeTemplate(${m.key ? `'${m.key}'` : 'null'})">Compose template</button></div>`;
  if (m.kind === 'download') { const d = dl(s.deliv); const o = ob(s.ob); const sm = checkSummary(s); const cov = buildDoc(s)[0]; const files = downloadFiles(s);
    inner = `<h2>Download — ${esc(o.label)}</h2><div class="mut sm" style="margin:6px 0 12px">Draft v${s.version}, generated from the current figures. The download is what the template "${esc(d.name)}" defines — ${files.length} file${files.length === 1 ? '' : 's'}, nothing else. Every download is stamped with the version and the date, and recorded in the history; the checks and the lineage stay in this workspace.</div>
      <div class="note ${sm.open ? 'warn' : sm.stated ? 'warn' : 'good'}" style="margin-bottom:12px"><b>Cover sheet says:</b> ${sm.pass} pass · ${sm.fail} fail · ${sm.na} cannot evaluate${sm.open ? ` · <b>${sm.open} open</b> (${openItems(s).map(x => esc(x.title)).join('; ')})` : ''}${sm.stated ? ` · ${sm.stated} stated on the document` : ''} · ${cov.overrides + cov.edits} author decision${cov.overrides + cov.edits === 1 ? '' : 's'} on the record.</div>
      <div class="files">${files.map(([k, n, w, a]) => `<div class="f"><span class="ic">${k}</span><div class="grow"><b class="mono sm">${n}</b><div class="mut xs">${w}</div></div><button class="btn sm ${k === 'PPTX' || k === 'PDF' ? 'pri' : ''}" onclick="${a}">${a === 'printMain()' ? 'Print' : 'Download'}</button></div>`).join('')}</div>
      <div class="acts"><button class="btn" onclick="S.modal=null;render()">Close</button>${files.length > 1 ? `<button class="btn pri" onclick="exportZip()">↓ Download all ${files.length} as .zip</button>` : ''}</div>`; }
  return `<div class="modal-bg" onclick="if(event.target===this){S.modal=null;render()}"><div class="modal">${inner}</div></div>`; }

window.addEventListener('DOMContentLoaded', () => { restore(); render(); });

</script>
</body>
