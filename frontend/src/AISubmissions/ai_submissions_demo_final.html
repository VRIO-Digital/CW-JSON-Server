      return `<tr>${s.cols.map((c, ci) => { const v = r.cells[c[0]]; const sel = S.sel.cell && S.sel.cell.s === s.id && S.sel.cell.r === r.id && S.sel.cell.c === c[0]; return `<td class="cell ${c[2] || ''} ${sel ? 'sel' : ''}" id="cell-${s.id}-${r.id}-${c[0]}" onclick="focusCell('${s.id}','${r.id}','${c[0]}')">${v ? v.v : ''}${v && v.coord && v.coord !== 'record' && (v.raw != null || v.coord === 'derived') ? `<span class="coord">${v.coord}</span>` : ''}${ci === 0 ? rowEdit : ''}</td>`; }).join('')}</tr>`; }).join('')}
    ${s.total ? `<tr class="total"><td colspan="${s.cols.length - 1}">${s.total.label}</td><td class="num cell ${S.sel.cell?.r === 'total' && S.sel.cell?.s === s.id ? 'sel' : ''}" id="cell-${s.id}-total-cost" onclick="focusCell('${s.id}','total','cost')">${s.total.cell.v}</td></tr>` : ''}</tbody></table>`;
    if (editing) body += `<div class="note" style="margin-top:10px">${s.id === 'S2' ? `<b>What you can change here.</b> Nothing directly — every line is derived from Schedule 1 and the stream parameters. Cap, fixed charge rate and revenues come from stream setup: <a onclick="editSetup(4)">open Stream settings</a>. Figures are never typed over.` : `<b>What you can change here.</b> Which projects are in scope — each move is recorded with your reason, and the original rule stays visible in Schedule 3. Figures are read from the ledger and the register and cannot be typed over; if a figure is wrong, fix the source and <a onclick="reresolve()">re-resolve from sources</a>.`}</div>`;
  }
  if (s.kind === 'narrative') {
    body = `<div class="dim xs" style="margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:600">AI-drafted · every figure cited</div>${s.paras.map((p, idx) => { const k = s.id + '.' + idx; const e = f.narrativeEdits && f.narrativeEdits[k]; return `<div class="para ${e ? 'edited' : ''}" ${editing ? `contenteditable="true" onblur="editPara('${k}',this)" style="outline:1px dashed var(--line2);background:var(--inset)"` : ''}>${e || p}</div>`; }).join('')}
      <div class="row" style="margin-top:6px;gap:10px"><span class="dim xs grow">Blue chips cite a schedule cell; purple cite a document.${editing ? ' Click a paragraph to edit. Edited paragraphs are marked and kept until you regenerate.' : ''}</span>${editing ? `<button class="btn sm" onclick="regenNarrative('${s.id}')">↻ Regenerate from current figures</button>` : ''}</div>`;
  }
  if (s.kind === 'attestation') { const a = f.attestation; const off = DB.people[f.officer];
    body = `<div class="attest"><div class="dim xs" style="margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:600">Human-only block · the model never writes here</div><p style="margin:0 0 12px" ${editing && !a ? `contenteditable="true" onblur="editAttest(this)" style="outline:1px dashed var(--line2);background:var(--bg1);padding:6px;border-radius:6px"` : ''}>${esc(s.text)}</p>${a ? `<div class="row" style="gap:14px"><div class="sig">${DB.people[a.by].name}</div><div class="sm mut">${DB.people[a.by].title}<br>Signed ${fdt(a.at)} · recorded against v${a.v}</div></div>` : `<div class="row" style="gap:14px"><div class="dim" style="font-style:italic">Unsigned</div><div class="sm mut">To be signed by <b>${off.name}</b>, ${off.title} — the officer chosen in stream setup — once the draft is in review.${editing ? ' The wording can be edited until it is signed.' : ''}</div></div>`}</div>${editing && a ? '<div class="note" style="margin-top:8px">Signed. The wording is locked; a change would require the officer to sign again.</div>' : ''}`; }
  return `<div class="sec ${act ? 'act' : ''}" id="sec-${s.id}" onclick="S.sel.section='${s.id}'">${head}${body}</div>`;
}
function focusCell(sId, rId, cK) { S.sel = { section: sId, cell: { s: sId, r: rId, c: cK } }; S.rtab = 'lineage'; render(); document.getElementById(`cell-${sId}-${rId}-${cK}`)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
function readinessPanel(secs, cs) { const b = blockers(); const f = DB.filing; return `<div class="note ${b.length ? (b.some(x => x.status === 'na') ? 'warn' : 'bad') : 'good'}" style="margin-bottom:10px">${b.length ? `<b>${b.length} blocking</b> — approval is disabled until these pass or are stated. A check that <i>cannot be evaluated</i> is shown, never hidden.` : '<b>All checks pass.</b>'}</div>
  ${cs.map(c => `<div class="chk ${c.status}"><span class="ic">${c.status === 'pass' ? '✓' : c.status === 'fail' ? '✕' : '?'}</span><div class="grow"><div class="t">${esc(c.title)}</div><div class="d">${c.detail}</div>${c.fixes.length && editable() ? `<div class="fix">${c.fixes.map(x => `<button class="btn sm" ${x.disabled ? 'disabled' : ''} onclick="${x.act}">${x.label}</button>`).join('')}</div>` : c.fixes.length ? '<div class="dim xs" style="margin-top:4px">Locked after approval — ask the approver to request changes.</div>' : ''}</div></div>`).join('')}`; }
function lineagePanel(secs) { const c = S.sel.cell; if (!c) return '<div class="empty">Click any figure in a schedule to see where it came from.</div>'; const s = secs.find(x => x.id === c.s); const v = c.r === 'total' ? s.total.cell : s.rows.find(r => r.id === c.r)?.cells[c.c]; if (!v) return '<div class="empty">No lineage for this cell.</div>';
  const cited = secs.filter(x => x.kind === 'narrative').flatMap(x => x.paras.map((p, i) => p.includes(`focusCell('${c.s}','${c.r}','${c.c}')`) ? `${x.id} · paragraph ${i + 1}` : null)).filter(Boolean);
  return `<div class="lin"><div class="l"><b>Figure</b><div>${v.v}</div><div class="dim xs">${esc(s.title)}</div></div><div class="l"><b>Coordinate</b><div class="mono">${v.coord || 'record'}</div></div><div class="l"><b>Source</b><div>${esc(v.source || 'Fact set')}</div></div><div class="l"><b>As of</b><div class="mono">${v.asOf ? fdate(v.asOf) : '—'}</div></div><div class="l"><b>Cited by</b><div class="sm">${cited.join('<br>') || '<span class="dim">Not cited in the narrative.</span>'}</div></div></div>`; }
function commentsPanel() { const f = DB.filing; return `${f.status !== 'filed' ? `<div style="margin-bottom:12px"><textarea id="newc" placeholder="Comment — anchored to ${S.sel.section}"></textarea><div class="row sp" style="margin-top:6px"><span class="dim xs">Anchor: ${S.sel.section} · as ${DB.user.name}</span><button class="btn sm pri" onclick="addComment()">Add comment</button></div></div>` : ''}
  ${f.comments.length ? f.comments.map(c => `<div class="cmt ${c.resolved ? 'res' : ''}"><div class="h"><span class="avatar" style="width:22px;height:22px;font-size:9.5px">${DB.people[c.by].initials}</span><b>${DB.people[c.by].name}</b><span>·</span><span>${fdt(c.at)}</span><span class="tag">${c.anchor}</span>${c.resolved ? '<span class="chip green" style="margin-left:auto">resolved</span>' : `<button class="btn sm ghost" style="margin-left:auto" onclick="resolveComment('${c.id}')">Resolve</button>`}</div><div class="b">${esc(c.text)}</div></div>`).join('') : '<div class="empty">No comments yet.</div>'}`; }

/* ---- ACTIONS ---- */
function bump(what, by = 'nishant') { const f = DB.filing; f.version++; f.history.push({ v: f.version, at: nowISO(), by, what }); }
function setStatus(st) { DB.filing.status = st; ob('dsic').status = st; if (!['drafting', 'in_review'].includes(st)) S.editSec = null; }
function submit() { setStatus('in_review'); bump('Submitted for review'); toast('Submitted for review. The attesting officer and the Regulatory Lead are notified.'); }
function requestChanges() { S.modal = { kind: 'text', title: 'Request changes (as Marc Beaulieu)', label: 'What must change before this can be approved?', ok: 'Send back to author', onok: v => { setStatus('drafting'); DB.filing.comments.push({ id: 'c' + (DB.filing.comments.length + 1), by: 'marc', at: nowISO(), anchor: S.sel.section, text: v, resolved: false }); bump('Returned to author', 'marc'); toast('Returned to the author with the comment.'); } }; render(); }
function approve() { if (blockers().length) return; setStatus('approved'); DB.filing.approver = { by: 'marc', at: nowISO() }; bump('Approved by Marc Beaulieu', 'marc'); toast('Approved. The filing package can now be issued.'); }
function doAttest() { const f = DB.filing; const off = DB.people[f.officer]; if ($('#signame').value.trim().toLowerCase() !== off.name.toLowerCase()) { toast('Type the officer\'s name exactly: ' + off.name); return; } f.attestation = { by: f.officer, at: nowISO(), v: f.version }; bump('Officer attestation signed', f.officer); S.modal = null; toast('Attestation signed and recorded on v' + f.version); }
function addComment() { const v = $('#newc').value.trim(); if (!v) return; DB.filing.comments.push({ id: 'c' + (DB.filing.comments.length + 1), by: 'nishant', at: nowISO(), anchor: S.sel.section, text: v, resolved: false }); render(); }
function resolveComment(id) { DB.filing.comments.find(c => c.id === id).resolved = true; bump('Comment ' + id + ' resolved'); render(); }
function attachCertificate(pid) { const p = DB.projects.find(x => x.id === pid); const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.pdf,.jpg,.png'; inp.onchange = () => { const file = inp.files[0]; if (!file) return; p.record = file.name.replace(/\.[^.]+$/, ''); p.attached = { name: file.name, at: DB.today, by: 'nishant' }; p.decision = 'include'; p.rule = 'eligible'; p.override = null; bump(`Certificate attached for ${p.code}: ${file.name} — project included`); toast(`${file.name} attached. ${p.name} moves into Schedule 1; schedules and checks re-solved.`); }; inp.click(); }
function requestCertificate(pid) { const f = DB.filing; f.evidenceRequests = f.evidenceRequests || []; if (f.evidenceRequests.some(r => r.pid === pid)) return; f.evidenceRequests.push({ pid, to: 'controls', at: nowISO() }); bump(`In-service certificate requested from ${DB.people.controls.name} for ${DB.projects.find(x => x.id === pid).code}`); toast(`Request sent to ${DB.people.controls.name}. The check stays open until the certificate is attached or the project is excluded.`); }
function includeWithReason(pid) { const p = DB.projects.find(x => x.id === pid); S.modal = { kind: 'text', title: `Include ${p.name}`, label: `Reason — recorded in Schedule 1 with your name and the time. The rule it overrides (${DB.rules[p.rule].label}) stays visible in the lineage.`, ok: 'Include with reason', onok: v => { p.decision = 'include'; p.override = { to: 'include', reason: v, at: nowISO(), by: 'nishant', originalRule: p.rule }; if (!p.record) p.record = 'override — see reason'; if (!p.inService) p.inService = p.forecast || DB.today; bump(`Scope override: ${p.code} included — ${v.slice(0, 60)}`); toast('Scope changed. Schedules 1–3 and the checks re-solved.'); } }; render(); }
function editPara(k, el) { const f = DB.filing; f.narrativeEdits = f.narrativeEdits || {}; const secId = k.split('.')[0]; const idx = +k.split('.')[1]; const orig = buildDoc().find(x => x.id === secId).paras[idx]; const cur = f.narrativeEdits[k] || orig; if (el.innerHTML !== cur) { f.narrativeEdits[k] = el.innerHTML; bump(`Narrative ${secId} paragraph ${idx + 1} edited`); render(); } }
function regenNarrative(secId) { const f = DB.filing; const keys = Object.keys(f.narrativeEdits || {}).filter(k => k.startsWith(secId + '.')); if (!keys.length) { toast('Narrative already reflects the current figures.'); return; } if (!confirm(`Regenerate ${secId}? ${keys.length} edited paragraph(s) will be replaced with text drafted from the current figures.`)) return; keys.forEach(k => delete f.narrativeEdits[k]); bump(`${secId} regenerated from current figures`); toast(`${secId} re-drafted from v${f.version} figures.`); }
function editAttest(el) { const f = DB.filing; if (f.attestation) return; const t = el.textContent.trim(); const cur = f.attestText || buildDoc().find(x => x.kind === 'attestation').text; if (t && t !== cur) { f.attestText = t; bump('Attestation wording edited'); render(); } }
function reresolve() { bump('Re-resolved from sources'); toast('Re-resolved against GL as-of 31 Aug 2026 and the register as-of 15 Sep 2026 — 0 figures changed.'); }
function excludeWithReason(pid) { const p = DB.projects.find(x => x.id === pid); S.modal = { kind: 'text', title: `Exclude ${p.name}`, label: 'Reason — recorded in Schedule 3 with your name and the time; the original rule is kept beside it.', ok: 'Exclude with reason', onok: v => { p.decision = 'exclude'; p.override = { to: 'exclude', reason: v, at: nowISO(), by: 'nishant', originalRule: p.rule }; bump(`Scope override: ${p.code} excluded`); toast('Scope changed. Schedules 1–3 and the checks re-solved.'); } }; render(); }
function issuePackage() { const f = DB.filing; setStatus('package_issued'); bump('Filing package issued', 'marc'); f.package = { id: `PKG-NJ-DSIC-v${f.version}`, at: nowISO(), by: 'marc' }; S.modal = { kind: 'package' }; render(); }
function recordFiling() { const date = $('#rf_date').value, conf = $('#rf_conf').value.trim(); if (!date || !conf) { toast('Date filed and confirmation reference are required.'); return; }
  const o = ob('dsic'); setStatus('filed'); o.filed = { date, by: 'marc', confirmation: conf }; bump(`Filed ${fdate(date)} · ${conf}`, 'marc');
  DB.obligations.splice(1, 0, { id: 'dsic_next', label: 'DSIC semi-annual filing', toShort: 'NJ BPU', template: 'Infrastructure surcharge periodic filing', period: 'Recovery period 1 Sep 2026 – 28 Feb 2027', due: '2027-04-15', leadDays: 30, status: 'not_started', docket: 'WR24050321', officer: o.officer });
  S.modal = null; toast('Filing recorded. The version is locked and the next period is on the calendar.'); }

/* ---- EXPORTS ---- */
const strip = h => String(h ?? '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
const csvq = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
function download(name, text) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'text/csv' })); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportCSV(secId) { const f = DB.filing; const s = buildDoc().find(x => x.id === secId); const o = ob('dsic'); const out = [csvq(`${DB.tenant.name} — ${o.label} — ${o.period} — v${f.version} — ${f.status === 'filed' ? 'FILED ' + o.filed.confirmation : 'FILING-READY, NOT FILED'}`), csvq(s.title), s.cols.map(c => csvq(c[1])).concat([csvq('coordinate'), csvq('source'), csvq('as of')]).join(',')];
  s.rows.forEach(r => { const last = r.cells[s.cols[s.cols.length - 1][0]] || {}; out.push(s.cols.map(c => { const v = r.cells[c[0]]; return csvq(v ? (v.raw ?? strip(v.v)) : ''); }).concat([csvq(last.coord || ''), csvq(last.source || ''), csvq(last.asOf || '')]).join(',')); });
  if (s.total) out.push([csvq(s.total.label), ...s.cols.slice(1).map((c, i) => i === s.cols.length - 2 ? csvq(s.total.cell.raw) : csvq(''))].join(','));
  download(`DSIC_filing_${secId}_v${f.version}.csv`, out.join('\n')); toast(`${secId} exported as CSV with coordinate, source and as-of columns.`); }
function exportLineage() { const f = DB.filing; const out = [['schedule', 'row', 'column', 'value', 'coordinate', 'source', 'as_of'].map(csvq).join(',')];
  buildDoc().filter(x => x.kind === 'schedule').forEach(s => { s.rows.forEach(r => s.cols.forEach(c => { const v = r.cells[c[0]]; if (v && (v.source || v.coord)) out.push([s.id, r.id, c[0], v.raw ?? strip(v.v), v.coord || 'record', v.source || '', v.asOf || ''].map(csvq).join(',')); })); if (s.total) out.push([s.id, 'total', 'cost', s.total.cell.raw, s.total.cell.coord, s.total.cell.source, s.total.cell.asOf].map(csvq).join(',')); });
  download(`DSIC_filing_lineage_v${f.version}.csv`, out.join('\n')); toast(`Lineage appendix exported — ${out.length - 1} figures.`); }

/* ---- MODALS ---- */
function modal() { const m = S.modal; let inner = '';
  if (m.kind === 'text') inner = `<h2>${esc(m.title)}</h2><label class="f" style="margin-top:8px">${esc(m.label)}<textarea id="mtext"></textarea></label><div class="acts"><button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn pri" onclick="const v=document.getElementById('mtext').value.trim();if(!v)return;S.modal.onok(v);S.modal=null;render()">${esc(m.ok)}</button></div>`;
  if (m.kind === 'addob') inner = `<h2>Add an obligation</h2><div class="mut sm" style="margin:6px 0 12px">For a report the agents did not find, or a recipient the Pack does not know. It is added to this stream as <b>declared by you</b>. A Pack template gives it schedules and rules; "from last report sent" builds a template from a prior document.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="f">Obligation name<input type="text" id="ao_label" placeholder="e.g. Lead service line mechanism — annual report"></label><label class="f">Recipient<select id="ao_to" style="font:inherit;padding:7px 10px;border:1px solid var(--line2);border-radius:8px"><option>NJ BPU</option><option>NJDEP</option><option>Other</option></select></label>
      <label class="f">Template<select id="ao_tpl" style="font:inherit;padding:7px 10px;border:1px solid var(--line2);border-radius:8px"><option>Mechanism annual report</option><option>Infrastructure surcharge periodic filing</option><option>Commission annual report</option><option>Base rate case exhibit</option><option>Compliance certification</option><option>From last report sent (build template)</option></select></label><label class="f">Cadence<select id="ao_cad" style="font:inherit;padding:7px 10px;border:1px solid var(--line2);border-radius:8px"><option>Annual</option><option>Semi-annual</option><option>Quarterly</option><option>Per case</option><option>One-off</option></select></label>
      <label class="f">Period (optional)<input type="text" id="ao_period" placeholder="e.g. Calendar year 2026"></label><label class="f">Due date (optional — empty keeps it as "No dates configured")<input type="date" id="ao_due"></label><label class="f">Drafting lead (days)<input type="text" id="ao_lead" value="30"></label></div>
      <div class="acts"><button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn pri" onclick="addObligation()">Add obligation</button></div>`;
  if (m.kind === 'attest') { const off = DB.people[DB.filing.officer]; inner = `<h2>Officer attestation</h2><div class="mut sm" style="margin:6px 0 10px">Hand-off: <b>${off.name}</b>, ${off.title}, signs this block. Signing records name, role and time against v${DB.filing.version}. Only a person signs it.</div><div class="attest"><p style="margin:0">${esc(buildDoc().find(s => s.kind === 'attestation').text)}</p></div><label class="f" style="margin-top:12px">Type the officer's full name to sign<input type="text" id="signame" placeholder="${off.name}"></label><div class="acts"><button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn pri" onclick="doAttest()">Sign</button></div>`; }
  if (m.kind === 'package') { const f = DB.filing; const issued = !!f.package; const files = [['PDF', `DSIC_filing_v${f.version}.pdf`, 'The document as reviewed — schedules, narrative, attestation. Watermarked until the filing is recorded.', 'window.print()'], ['CSV', 'DSIC_filing_S1.csv', 'Schedule 1 with coordinate and as-of columns', "exportCSV('S1')"], ['CSV', 'DSIC_filing_S2.csv', 'Schedule 2 — revenue requirement and cap test', "exportCSV('S2')"], ['CSV', 'DSIC_filing_S3.csv', 'Schedule 3 — exclusions with rule', "exportCSV('S3')"], ['CSV', 'DSIC_filing_lineage.csv', 'Every figure with its coordinate, source and as-of', 'exportLineage()']];
    inner = `<h2>Filing package${issued ? ' — ' + f.package.id : ''}</h2><div class="mut sm" style="margin:6px 0 12px">${issued ? `Issued ${fdt(f.package.at)} by ${DB.people[f.package.by].name}. Contents are fixed to v${f.version}.` : `What will be issued for v${f.version}. A person files it through ${DB.regulator.portal}; Context Weave does not submit it.`}</div>
      <div class="files">${files.map(([k, n, w, a]) => `<div class="f"><span class="ic">${k}</span><div class="grow"><b class="mono sm">${n}</b><div class="mut xs">${w}</div></div>${issued && a ? `<button class="btn sm" onclick="${a}">Open</button>` : ''}</div>`).join('')}</div>
      <div class="note">Watermark <span class="wm">FILING-READY · NOT FILED</span> is printed on every page until the filing is recorded with the regulator's confirmation.</div>
      <div class="acts"><button class="btn" onclick="S.modal=null;render()">Close</button>${!issued ? `<button class="btn pri" onclick="issuePackage()">Issue package (as Marc)</button>` : ''}</div>`; }
  if (m.kind === 'record') inner = `<h2>Record the filing</h2><div class="mut sm" style="margin:6px 0 12px">Hand-off: Marc Beaulieu filed ${DB.filing.package.id} with ${DB.regulator.name} through ${DB.regulator.portal}. Record what the regulator gave back. This locks v${DB.filing.version} and opens the next period.</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="f">Date filed<input type="date" id="rf_date" value="${DB.today}" max="${DB.today}"></label><label class="f">Confirmation reference<input type="text" id="rf_conf" placeholder="e.g. BPU-2026-104511"></label></div>
      <div class="acts"><button class="btn" onclick="S.modal=null;render()">Cancel</button><button class="btn pri" onclick="recordFiling()">Record filing</button></div>`;
  return `<div class="modal-bg" onclick="if(event.target===this){S.modal=null;render()}"><div class="modal">${inner}</div></div>`; }

window.addEventListener('DOMContentLoaded', () => { restore(); render(); });

</script>
</body>
</html>
